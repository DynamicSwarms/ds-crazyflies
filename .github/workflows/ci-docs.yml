name: DS Crazyflie Docs

on:
  push:
    branches:
      - master
      - lyrical
  pull_request:
    branches:
      - master
      - lyrical
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        # vcstool 0.3.0 requires pkg_resources, removed in newer setuptools.
        run: python -m pip install -r docs/requirements.txt vcstool==0.3.0 setuptools==80.9.0

      - name: Import API sources
        run: |
          mkdir -p src/external
          vcs import src/external < repos/core.repos

      - name: Build documentation
        run: python -m sphinx -b html docs docs/_build/html

      # Disable Jekyll so GitHub Pages serves Sphinx assets correctly.
      - name: Disable GitHub Jekyll
        run: touch docs/_build/html/.nojekyll

      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/_build/html
